name: Build Data

# Manual only - the fetch/build:data pipeline downloads and processes bulk
# GIS source data from the Intendencia endpoints and is expensive to run.
# Trigger by hand whenever the underlying source data needs to be refreshed.
on:
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: us-east-1

jobs:
  build-data:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Cache raw source downloads
        uses: actions/cache@v4
        with:
          path: data/raw
          key: mvd-map-data-raw-${{ hashFiles('scripts/sources.mjs') }}
          restore-keys: |
            mvd-map-data-raw-

      - name: Fetch source data
        run: npm run fetch

      - name: Build data
        run: npm run build:data

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN_PROD }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Sync data to S3
        run: aws s3 sync ./data s3://${{ vars.S3_BUCKET_NAME }}/data --delete --exclude "raw/*"

      - name: Invalidate CloudFront cache
        run: |
          aws cloudfront create-invalidation \
            --distribution-id ${{ vars.CLOUDFRONT_DISTRIBUTION_ID }} \
            --paths "/data/*"
